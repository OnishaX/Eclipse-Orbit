<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Orbit</title>
<style>
  :root { --bg:#07080c; --card:#12141c; --line:#262a36; --text:#eef0f6; --dim:#8b91a3; --accent:#ffb547; --bad:#ff6b6b; --good:#4cd98a; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 50% -20%,#2a1d06 0,var(--bg) 55%); color:var(--text); min-height:100vh; }
  main { max-width:880px; margin:0 auto; padding:32px 20px 64px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .logo { position:relative; width:30px; height:30px; }
  .logo::before { content:""; position:absolute; inset:8px; border-radius:50%; background:radial-gradient(circle,#fff3c4,var(--accent) 60%,#ff7a18); box-shadow:0 0 18px #ffb54788; }
  .logo::after { content:""; position:absolute; inset:0; border-radius:50%; border:1.5px solid #ffb54766; transform:rotate(-25deg) scaleY(.45); }
  h1 { font-size:22px; margin:0; flex:1; }
  h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:28px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .grow { flex:1; min-width:0; }
  .sub { color:var(--dim); font-size:13px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--line); }
  .dot.on { background:var(--good); box-shadow:0 0 8px var(--good); }
  input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#0b0d13; color:var(--text); font:inherit; margin-bottom:10px; }
  button { padding:10px 16px; border-radius:10px; border:0; background:var(--accent); color:#1b1200; font:600 14px system-ui; cursor:pointer; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--bad); border:1px solid #ff6b6b55; }
  .inline { display:flex; gap:8px; } .inline input { margin:0; }
  .error { color:var(--bad); min-height:1.4em; margin:4px 0 0; }
  .code { font:700 28px ui-monospace,monospace; letter-spacing:.2em; color:var(--accent); }
  .empty { color:var(--dim); padding:8px 0; }
  dialog { width:min(440px, 90vw); border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); padding:20px; }
  dialog::backdrop { background:#000a; }
  .assignment { display:flex; align-items:center; gap:10px; padding:8px 0; }
  .assignment input { width:auto; margin:0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header><div class="logo"></div><h1 id="title">Orbit</h1><button id="logout" class="ghost" hidden>Sign out</button></header>

  <section id="auth" hidden>
    <div class="card" style="max-width:380px;margin:40px auto">
      <h2 id="auth-title" style="margin-top:0">Sign in</h2>
      <form id="auth-form">
        <input id="username" autocomplete="username" placeholder="Username" value="admin" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
        <button type="submit" id="auth-button" style="width:100%">Sign in</button>
        <p class="error" id="auth-error"></p>
      </form>
    </div>
  </section>

  <section id="app" hidden>
    <div id="pair-section" hidden>
      <h2>Add device to Orbit</h2>
      <div class="card" id="pair-card"></div>
    </div>

    <h2>Devices</h2>
    <p class="sub">After assigning users, add them in Settings › Connections › Eclipse Orbit, or link a TV user in their Connections settings. User sync is experimental.</p>
    <div class="card" id="devices"></div>

    <h2>Users</h2>
    <div class="card">
      <div id="profiles"></div>
      <form class="inline" id="profile-form" style="margin-top:12px">
        <input id="profile-name" placeholder="New user name" required>
        <button type="submit">Add</button>
      </form>
    </div>
  </section>
</main>
<dialog id="assign-dialog">
  <form id="assign-form">
    <h2 id="assign-title" style="margin-top:0"></h2>
    <p class="sub">Choose Orbit users for this device. Existing TV users are not removed.</p>
    <div id="assign-users"></div>
    <div class="inline"><button type="submit">Save</button><button type="button" class="ghost" id="assign-cancel">Cancel</button></div>
    <p class="error" id="assign-error"></p>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const pairCode = (location.pathname.match(/^\/pair\/([A-Za-z0-9]+)/) || [])[1];
let needsSetup = false;
let currentDevices = [], currentProfiles = [], assigningDevice = null;

async function api(path, options = {}) {
  const res = await fetch("/api/admin" + path, {
    method: options.method || "GET",
    headers: options.body ? { "Content-Type": "application/json" } : {},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function ago(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(ms).toLocaleDateString();
}

async function boot() {
  const status = await api("/status");
  $("title").textContent = status.serverName;
  document.title = status.serverName;
  needsSetup = status.needsSetup;
  if (!status.signedIn) {
    $("auth").hidden = false;
    $("auth-title").textContent = needsSetup ? "Create admin account" : "Sign in";
    $("auth-button").textContent = needsSetup ? "Create account" : "Sign in";
    $("password").autocomplete = needsSetup ? "new-password" : "current-password";
    return;
  }
  $("auth").hidden = true;
  $("app").hidden = false;
  $("logout").hidden = false;
  if (pairCode) loadPairing();
  refresh();
}

async function refresh() {
  const [devices, profiles] = await Promise.all([api("/devices"), api("/profiles")]);
  currentDevices = devices;
  currentProfiles = profiles;
  $("devices").innerHTML = devices.length ? devices.map((d) => `
    <div class="row">
      <span class="dot ${d.online ? "on" : ""}"></span>
      <div class="grow"><div>${esc(d.name)}</div><div class="sub">${esc(d.model)} · last seen ${ago(d.lastSeen)}${d.hasBackup ? " · backed up" : ""}</div></div>
      <button class="ghost" data-assign-device="${esc(d.id)}">Users (${d.profileIds.length})</button>
      <button class="danger" data-remove-device="${esc(d.id)}">Remove</button>
    </div>`).join("") : `<div class="empty">No devices yet. On a TV, choose Add device to Orbit (during setup or in Settings › Connections › Eclipse Orbit) and scan the QR code.</div>`;
  $("profiles").innerHTML = profiles.length ? profiles.map((p) => `
    <div class="row">
      <div class="grow">${esc(p.name)}</div>
      <button class="danger" data-remove-profile="${esc(p.id)}">Remove</button>
    </div>`).join("") : `<div class="empty">No users yet.</div>`;
}

async function loadPairing() {
  $("pair-section").hidden = false;
  const card = $("pair-card");
  try {
    const p = await api("/pair/" + pairCode);
    if (p.status !== "pending") throw new Error("This code has already been used.");
    card.innerHTML = `
      <div class="code">${esc(p.code)}</div>
      <p class="sub">Check this matches the code on your TV, then name it.</p>
      <input id="pair-name" value="${esc(p.name)}">
      <div class="inline"><button id="pair-approve">Add to Orbit</button><button class="ghost" id="pair-deny">Cancel</button></div>
      <p class="error" id="pair-error"></p>`;
    $("pair-approve").onclick = () => decide("approve", { name: $("pair-name").value });
    $("pair-deny").onclick = () => decide("deny");
  } catch (e) {
    card.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function decide(action, body) {
  try {
    await api(`/pair/${pairCode}/${action}`, { method: "POST", body: body || {} });
    $("pair-card").innerHTML = `<div class="empty">${action === "approve" ? "Added to Orbit — your TV will finish setting up on its own." : "Cancelled."}</div>`;
    history.replaceState(null, "", "/");
    refresh();
  } catch (e) {
    $("pair-error").textContent = e.message;
  }
}

$("auth-form").onsubmit = async (e) => {
  e.preventDefault();
  $("auth-error").textContent = "";
  try {
    await api(needsSetup ? "/setup" : "/login", { method: "POST", body: { username: $("username").value, password: $("password").value } });
    boot();
  } catch (err) {
    $("auth-error").textContent = err.message;
  }
};

$("logout").onclick = async () => { await api("/logout", { method: "POST" }); location.reload(); };

$("profile-form").onsubmit = async (e) => {
  e.preventDefault();
  await api("/profiles", { method: "POST", body: { name: $("profile-name").value } });
  $("profile-name").value = "";
  refresh();
};

$("assign-cancel").onclick = () => $("assign-dialog").close();
$("assign-form").onsubmit = async (e) => {
  e.preventDefault();
  const button = $("assign-form").querySelector('button[type="submit"]');
  button.disabled = true;
  $("assign-error").textContent = "";
  try {
    const profileIds = [...$("assign-users").querySelectorAll("input:checked")].map((input) => input.value);
    await api("/devices/" + encodeURIComponent(assigningDevice) + "/profiles", { method:"PUT", body:{ profileIds } });
    $("assign-dialog").close();
    await refresh();
  } catch (err) {
    $("assign-error").textContent = err.message;
  } finally {
    button.disabled = false;
  }
};

document.addEventListener("click", async (e) => {
  const device = e.target.dataset.removeDevice, profile = e.target.dataset.removeProfile;
  const assign = e.target.dataset.assignDevice;
  if (assign) {
    const selected = currentDevices.find((d) => d.id === assign);
    if (!selected) return;
    assigningDevice = assign;
    $("assign-title").textContent = "Users on " + selected.name;
    $("assign-error").textContent = "";
    $("assign-users").innerHTML = currentProfiles.length ? currentProfiles.map((p) =>
      `<label class="assignment"><input type="checkbox" value="${esc(p.id)}" ${selected.profileIds.includes(p.id) ? "checked" : ""}>${esc(p.name)}</label>`
    ).join("") : `<p class="sub">Add users on the dashboard first.</p>`;
    $("assign-dialog").showModal();
  }
  if (device && confirm("Remove this device? It will need to be set up again.")) { await api("/devices/" + device, { method: "DELETE" }); refresh(); }
  if (profile && confirm("Remove this user?")) { await api("/profiles/" + profile, { method: "DELETE" }); refresh(); }
});

setInterval(() => { if (!$("app").hidden) refresh(); }, 10000);
boot();
</script>
</body>
</html>
